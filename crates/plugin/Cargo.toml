[package]
name = "lumen-plugin"
description = "CLAP/VST3 wrapper for the Lumen synthesizer"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# nih-plug's VST3 bindings are GPLv3: a binary built with this feature must be distributed under GPLv3.
vst3 = ["nih_plug/vst3"]
# The egui editor. Needs X11/OpenGL development libraries on Linux.
gui = ["dep:nih_plug_egui"]
# A self-contained app with its own audio and MIDI I/O (`lumen-standalone`).
standalone = ["gui", "nih_plug/standalone", "dep:cpal", "dep:midir"]

[[bin]]
name = "lumen-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
lumen-engine.workspace = true
lumen-preset.workspace = true
serde_json = "1"
# Device and MIDI port lists for the standalone's settings (same versions nih-plug uses).
cpal = { version = "0.15", optional = true }
midir = { version = "0.9", optional = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", default-features = false }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", optional = true }
